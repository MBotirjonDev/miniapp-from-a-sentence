name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
        exclude:
          - { os: macos-latest, node: 18 }
          - { os: windows-latest, node: 18 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --test tests/miniapp.test.cjs tests/new-app.test.cjs
  walkthrough:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node scripts/walkthrough.cjs --no-shots
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: MBotirjonDev/skillset-lint@v0.1.0
        with:
          path: skills
